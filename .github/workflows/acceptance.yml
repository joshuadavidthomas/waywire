name: acceptance

# The dogfood task replays (tools/acceptance) build two driver images and run
# about 25 cells per distro, which takes longer than a push check should, so
# they run nightly and on demand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    # The binaries must run on Debian 12's glibc, so build them there.
    runs-on: ubuntu-24.04
    container: debian:bookworm
    permissions:
      contents: read
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libcairo2-dev libclang-dev \
            libpango1.0-dev libpipewire-0.3-dev libpixman-1-dev libxkbcommon-dev nasm \
            npm pkg-config xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Debian's Node 18 bootstraps the declared Node, which also runs the
      # JavaScript actions below when the runner does not provide its own.
      - name: Install Node from package.json
        run: |
          npm install --prefix "$RUNNER_TEMP/waywire-node" --no-package-lock --no-audit --no-fund \
            "node@$(node -p 'require("./package.json").engines.node')" corepack
          echo "$RUNNER_TEMP/waywire-node/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pnpm workspace
        run: |
          corepack enable --install-directory "$RUNNER_TEMP/waywire-node/node_modules/.bin"
          pnpm install --frozen-lockfile

      - name: Build
        run: just build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waywire-release
          path: |
            target/release/waywire-gateway
            target/release/waywire-compositor
          if-no-files-found: error

  suite:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [bookworm, trixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: waywire-release
          path: target/release

      - name: Replay the dogfood tasks
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          chmod +x target/release/waywire-gateway target/release/waywire-compositor
          python3 tools/acceptance/suite.py --distro "$DISTRO"

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.distro }}
          path: target/acceptance/${{ matrix.distro }}
