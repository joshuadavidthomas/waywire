[package]
name = "waywire-compositor"
version.workspace = true
edition.workspace = true

[dependencies]
waywire-protocol = { workspace = true }

anyhow = { workspace = true }
cairo-rs = { workspace = true }
calloop = { workspace = true }
clap = { workspace = true }
nix = { workspace = true }
pangocairo = { workspace = true }
pipewire = { workspace = true }
shlex = "2.0.1"
smithay = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
# In-process striped H.264 (BSD-2-Clause Cisco OpenH264, built from vendored source).
# Its x86 assembly builds only when nasm is on PATH; without it the encoder silently
# falls back to C and the benchmark scroll costs about 50% more CPU.
openh264 = "0.9.9"
rayon = "1.11.0"
yuv = { version = "0.8.20", features = ["fast_mode"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wayland-protocols-wlr = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
# Client-side protocol access for the toplevel list and virtual keyboard tests.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }

[lints]
workspace = true
