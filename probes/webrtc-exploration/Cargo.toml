[workspace]
members = ["."]
resolver = "3"

[package]
name = "webrtc-exploration"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false
description = "Private WebRTC desktop test: one peer, owned capture and encoding, separate from production binaries."

[[bin]]
name = "webrtc-exploration"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
webrtc = "0.20.0"
rtc = "0.20.0"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bytes = "1.10.1"
socket2 = "0.6"
clap = { version = "4.5.54", features = ["derive"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
http = "1.4.0"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[lints.clippy]
all = "warn"
