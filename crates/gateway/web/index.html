<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Waywire</title>
    <link rel="stylesheet" href="/src/viewer/style.css" />
  </head>
  <body>
    <main id="stage" class="stage" data-pointer="moving">
      <canvas
        id="display"
        tabindex="0"
        aria-label="Interactive streamed Wayland desktop"
      ></canvas>
      <div id="signal" class="signal" data-state="idle" role="status">
        <p>
          <span id="signal-headline">Connecting</span>
          <span id="signal-message" class="signal-detail"></span>
        </p>
      </div>
      <p id="lease-notice" class="lease-notice" role="status" hidden></p>
      <dl id="hud" class="hud" hidden>
        <dt>Size</dt>
        <dd data-field="size" data-resize="idle">—</dd>
        <dt>Rate</dt>
        <dd data-field="fps">—</dd>
        <dt>Bitrate</dt>
        <dd data-field="bitrate">—</dd>
        <dt>Round trip</dt>
        <dd data-field="rtt">—</dd>
        <dt>Late</dt>
        <dd data-field="late">—</dd>
        <dt>Clock</dt>
        <dd data-field="clock">—</dd>
        <dt>Queues</dt>
        <dd data-field="queues">—</dd>
        <dt>Dropped</dt>
        <dd data-field="dropped">—</dd>
        <dt>Resize</dt>
        <dd data-field="resize">idle</dd>
        <dt>Codec</dt>
        <dd data-field="codec">—</dd>
      </dl>
      <button
        id="menu-key"
        class="menu-key"
        type="button"
        popovertarget="panel"
        aria-label="Controls"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <path d="M2 4.5h12M2 11.5h12" />
          </g>
          <circle cx="10.5" cy="4.5" r="2" fill="currentColor" />
          <circle cx="5.5" cy="11.5" r="2" fill="currentColor" />
        </svg>
      </button>
      <div id="panel" class="panel" popover>
        <ul class="lamps">
          <li id="status" class="lamp" data-state="idle">Video connecting</li>
          <li id="control-status" class="lamp" data-state="idle">Watching</li>
        </ul>
        <div class="actions" role="group" aria-label="Control">
          <button id="control-toggle" class="action" type="button">
            Stop driving
          </button>
        </div>
        <div class="actions" role="group" aria-label="Input modes">
          <button
            id="pointer-lock"
            class="action"
            type="button"
            aria-pressed="false"
          >
            Lock pointer
          </button>
          <button id="keyboard" class="action" type="button">Keyboard</button>
        </div>
        <div class="actions" role="group" aria-label="Clipboard">
          <button id="send-clipboard" class="action" type="button">
            Paste local clipboard to desktop
          </button>
          <button id="copy-clipboard" class="action" type="button" disabled>
            Copy desktop clipboard
          </button>
          <p id="clipboard-status" class="note" aria-live="polite"></p>
        </div>
        <div class="actions" role="group" aria-label="Preferences">
          <button
            id="hud-toggle"
            class="action"
            type="button"
            aria-pressed="false"
          >
            Show stats
          </button>
        </div>
        <fieldset id="latency" class="latency">
          <legend>Latency</legend>
          <label
            ><input type="radio" name="latency" value="60" checked />Low</label
          >
          <label
            ><input type="radio" name="latency" value="100" />Balanced</label
          >
          <label><input type="radio" name="latency" value="180" />Smooth</label>
        </fieldset>
        <div class="actions" role="group" aria-label="Recovery">
          <button id="reset-video" class="action" type="button">
            Reset video
          </button>
        </div>
        <p class="hint">Esc twice opens this panel; Esc closes it.</p>
      </div>
      <input
        id="ime-proxy"
        class="ime-proxy"
        aria-label="Text input"
        autocomplete="off"
      />
    </main>
    <script type="module" src="/src/viewer/client.ts"></script>
  </body>
</html>
