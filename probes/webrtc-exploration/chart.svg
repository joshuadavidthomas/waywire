<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1824"
  height="848"
  viewBox="0 0 1824 848"
>
  <defs>
    <linearGradient id="gray">
      <stop stop-color="#000" />
      <stop offset="1" stop-color="#fff" />
    </linearGradient>
    <linearGradient id="color">
      <stop stop-color="#f00" />
      <stop offset=".2" stop-color="#ff0" />
      <stop offset=".4" stop-color="#0f0" />
      <stop offset=".6" stop-color="#0ff" />
      <stop offset=".8" stop-color="#00f" />
      <stop offset="1" stop-color="#f0f" />
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff" />
      <rect width="1" height="4" fill="#f00" />
      <rect x="2" width="1" height="4" fill="#00f" />
    </pattern>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff" />
      <path d="M0 0H16M0 0V16" stroke="#183fce" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1824" height="848" fill="#fff" />
  <g font-family="monospace" fill="#151719">
    <text x="32" y="48" font-size="26">
      Owned synthetic desktop chart · 1824 × 848
    </text>
    <text x="32" y="80" font-size="16">
      Full-chroma video: small colored text, single-pixel edges, gradients and
      solid colors.
    </text>
    <text x="32" y="128" font-size="12">
      12px: const stream = await connect(); 0123456789 [] {} () &lt;/&gt;
    </text>
    <text x="32" y="154" font-size="14">
      14px: const stream = await connect(); 0123456789 [] {} () &lt;/&gt;
    </text>
    <text x="32" y="184" font-size="16">
      16px: const stream = await connect(); 0123456789 [] {} () &lt;/&gt;
    </text>
    <text x="32" y="216" font-size="18">
      18px: The browser displays video. The server runs the desktop.
    </text>
    <text x="32" y="256" font-size="12" fill="#d00020">
      Red 12px text on white: sharpness matters when reading code.
    </text>
    <text x="32" y="284" font-size="12" fill="#103dcc">
      Blue 12px text on white: [] {} () 0123456789 AaBbCcDdEeFf
    </text>
    <text x="32" y="312" font-size="14" fill="#007c28">
      Green 14px text on white: paths, comments and terminal output.
    </text>
    <text x="960" y="128" font-size="16">Single-pixel red/blue stripes</text>
    <rect x="960" y="144" width="800" height="144" fill="url(#lines)" />
    <text x="960" y="328" font-size="16">Single-pixel blue grid</text>
    <rect x="960" y="344" width="800" height="144" fill="url(#grid)" />
    <rect x="32" y="352" width="864" height="136" fill="#18202a" />
    <text x="48" y="384" font-size="12" fill="#eee">
      12px light text on dark: /home/sprite/desktop/example.rs
    </text>
    <text x="48" y="412" font-size="14" fill="#f486a2">
      14px pink: let frame = receiver.next().await?;
    </text>
    <text x="48" y="442" font-size="14" fill="#72bfff">
      14px blue: assert_eq!(frame.width(), 1824);
    </text>
    <text x="48" y="470" font-size="14" fill="#83d998">
      14px green: // Synthetic content, no user files
    </text>
    <rect x="32" y="528" width="1728" height="80" fill="url(#gray)" />
    <rect x="32" y="624" width="1728" height="80" fill="url(#color)" />
    <rect x="32" y="736" width="216" height="64" fill="#f00" />
    <rect x="248" y="736" width="216" height="64" fill="#0f0" />
    <rect x="464" y="736" width="216" height="64" fill="#00f" />
    <rect x="680" y="736" width="216" height="64" fill="#0ff" />
    <rect x="896" y="736" width="216" height="64" fill="#f0f" />
    <rect x="1112" y="736" width="216" height="64" fill="#ff0" />
    <rect x="1328" y="736" width="216" height="64" fill="#808080" />
    <rect x="1544" y="736" width="216" height="64" fill="#000" />
  </g>
</svg>
