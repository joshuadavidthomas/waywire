<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Waywire</title>
    <link rel="stylesheet" href="/src/viewer/style.css" />
  </head>
  <body>
    <main id="stage" class="stage" data-pointer="moving" data-panel="floating">
      <canvas
        id="display"
        tabindex="0"
        aria-label="Interactive streamed Wayland desktop"
      ></canvas>
      <div id="signal" class="signal" data-state="idle" role="status">
        <p>
          <span id="signal-headline">Connecting</span>
          <span id="signal-message" class="signal-detail"></span>
        </p>
      </div>
      <p id="lease-notice" class="lease-notice" role="status" hidden></p>
      <dl id="hud" class="hud" hidden>
        <dt>Size</dt>
        <dd data-field="size" data-resize="idle">—</dd>
        <dt>Rate</dt>
        <dd data-field="fps">—</dd>
        <dt>Bitrate</dt>
        <dd data-field="bitrate">—</dd>
        <dt>Round trip</dt>
        <dd data-field="rtt">—</dd>
        <dt>Late</dt>
        <dd data-field="late">—</dd>
        <dt>Clock</dt>
        <dd data-field="clock">—</dd>
        <dt>Queues</dt>
        <dd data-field="queues">—</dd>
        <dt>Dropped</dt>
        <dd data-field="dropped">—</dd>
        <dt>Resize</dt>
        <dd data-field="resize">idle</dd>
        <dt>Codec</dt>
        <dd data-field="codec">—</dd>
      </dl>
      <button
        id="menu-key"
        class="menu-key"
        type="button"
        popovertarget="panel"
        aria-label="Controls"
      >
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M6.5 2.25a.75.75 0 0 0-1.5 0v3a.75.75 0 0 0 1.5 0V4.5h6.75a.75.75 0 0 0 0-1.5H6.5v-.75ZM11 6.5a.75.75 0 0 0-1.5 0v3a.75.75 0 0 0 1.5 0v-.75h2.25a.75.75 0 0 0 0-1.5H11V6.5ZM5.75 10a.75.75 0 0 1 .75.75v.75h6.75a.75.75 0 0 1 0 1.5H6.5v.75a.75.75 0 0 1-1.5 0v-3a.75.75 0 0 1 .75-.75ZM2.75 7.25H8.5v1.5H2.75a.75.75 0 0 1 0-1.5ZM4 3H2.75a.75.75 0 0 0 0 1.5H4V3ZM2.75 11.5H4V13H2.75a.75.75 0 0 1 0-1.5Z"
          />
        </svg>
      </button>
      <div id="panel" class="panel" popover>
        <p id="panel-status" class="status" role="status">
          <span id="status" class="dot" data-state="idle"></span>
          <span id="status-video">Connecting</span>
          <span class="status-sep" aria-hidden="true">·</span>
          <span id="control-status" data-state="idle">Watching</span>
        </p>
        <ul class="menu" role="list" aria-label="Control">
          <li>
            <button id="control-toggle" class="item" type="button">
              Stop driving
            </button>
          </li>
          <li>
            <button
              id="pointer-lock"
              class="item"
              type="button"
              aria-pressed="false"
            >
              Lock pointer
            </button>
          </li>
          <li>
            <button id="keyboard" class="item" type="button">Keyboard</button>
          </li>
        </ul>
        <ul class="menu" role="list" aria-label="Clipboard">
          <li>
            <button id="send-clipboard" class="item" type="button">
              Paste local clipboard to desktop
            </button>
          </li>
          <li>
            <button id="copy-clipboard" class="item" type="button" disabled>
              Copy desktop clipboard
            </button>
          </li>
          <li id="clipboard-status" class="note" aria-live="polite"></li>
        </ul>
        <ul class="menu" role="list" aria-label="Recovery">
          <li>
            <button id="reset-video" class="item" type="button">
              Reset video
            </button>
          </li>
        </ul>
        <div class="prefs">
          <label class="pref" for="hud-toggle">
            <span>Stats</span>
            <span class="toggle">
              <span class="toggle-knob" aria-hidden="true"></span>
              <input
                id="hud-toggle"
                name="stats"
                type="checkbox"
                role="switch"
              />
            </span>
          </label>
          <fieldset id="latency" class="pref latency">
            <legend>Latency</legend>
            <label class="radio">
              <span class="radio-mark">
                <input name="latency" type="radio" value="60" checked />
              </span>
              Low
            </label>
            <label class="radio">
              <span class="radio-mark">
                <input name="latency" type="radio" value="100" />
              </span>
              Balanced
            </label>
            <label class="radio">
              <span class="radio-mark">
                <input name="latency" type="radio" value="180" />
              </span>
              Smooth
            </label>
          </fieldset>
        </div>
        <div class="panel-foot">
          <p class="hint">Esc twice opens this panel. Esc closes it.</p>
          <div class="tools">
            <button
              id="fullscreen"
              class="tool"
              type="button"
              aria-label="Full screen"
              aria-pressed="false"
            >
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path
                  fill-rule="evenodd"
                  d="M2.75 9a.75.75 0 0 1 .75.75v1.69l2.22-2.22a.75.75 0 0 1 1.06 1.06L4.56 12.5h1.69a.75.75 0 0 1 0 1.5h-3.5a.75.75 0 0 1-.75-.75v-3.5A.75.75 0 0 1 2.75 9ZM2.75 7a.75.75 0 0 0 .75-.75V4.56l2.22 2.22a.75.75 0 0 0 1.06-1.06L4.56 3.5h1.69a.75.75 0 0 0 0-1.5h-3.5a.75.75 0 0 0-.75.75v3.5c0 .414.336.75.75.75ZM13.25 9a.75.75 0 0 0-.75.75v1.69l-2.22-2.22a.75.75 0 1 0-1.06 1.06l2.22 2.22H9.75a.75.75 0 0 0 0 1.5h3.5a.75.75 0 0 0 .75-.75v-3.5a.75.75 0 0 0-.75-.75ZM13.25 7a.75.75 0 0 1-.75-.75V4.56l-2.22 2.22a.75.75 0 1 1-1.06-1.06l2.22-2.22H9.75a.75.75 0 0 1 0-1.5h3.5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-.75.75Z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
            <button
              id="pin-panel"
              class="tool"
              type="button"
              aria-label="Keep the panel open"
              aria-pressed="false"
            >
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path
                  d="M3.75 2a.75.75 0 0 0-.75.75v10.5a.75.75 0 0 0 1.28.53L8 10.06l3.72 3.72a.75.75 0 0 0 1.28-.53V2.75a.75.75 0 0 0-.75-.75h-8.5Z"
                />
              </svg>
            </button>
            <button
              id="close-panel"
              class="tool"
              type="button"
              aria-label="Close"
            >
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path
                  d="M5.28 4.22a.75.75 0 0 0-1.06 1.06L6.94 8l-2.72 2.72a.75.75 0 1 0 1.06 1.06L8 9.06l2.72 2.72a.75.75 0 1 0 1.06-1.06L9.06 8l2.72-2.72a.75.75 0 0 0-1.06-1.06L8 6.94 5.28 4.22Z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <input
        id="ime-proxy"
        class="ime-proxy"
        aria-label="Text input"
        autocomplete="off"
      />
    </main>
    <script type="module" src="/src/viewer/client.ts"></script>
  </body>
</html>
