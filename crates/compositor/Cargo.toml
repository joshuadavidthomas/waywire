[package]
name = "waywire-compositor"
version.workspace = true
edition.workspace = true

[dependencies]
waywire-protocol = { workspace = true }

anyhow = { workspace = true }
cairo-rs = { workspace = true }
calloop = { workspace = true }
clap = { workspace = true }
nix = { workspace = true }
pangocairo = { workspace = true }
shlex = "2.0.1"
smithay = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wayland-protocols-wlr = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
# Client-side protocol access for the toplevel list and virtual keyboard tests.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }

[lints]
workspace = true
