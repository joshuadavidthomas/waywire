[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0-rc.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# pedantic
missing_errors_doc = "allow"

# restriction
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
get_unwrap = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
panic_in_result_fn = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
waywire-protocol = { path = "crates/protocol" }

anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["ws"] }
calloop = { version = "0.14.4", features = ["signals"] }
calloop-wayland-source = "0.4.1"
clap = { version = "4.5.54", features = ["derive", "env"] }
futures-util = "0.3.31"
memmap2 = "0.9.9"
# Pin the tested syscall wrappers: both binaries rely on their FD, polling,
# signal and process-control behavior for backpressure and child cleanup.
nix = { version = "=0.31.3", features = ["fs", "mman", "poll", "process", "signal", "time"] }
rust-embed = { version = "8.11.0", features = ["deterministic-timestamps"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
socket2 = "0.6.1"
tempfile = "3.26.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2.5.8"
# Pin these together: generated bindings import wayland-client's core interfaces
# and share its scanner/backend types; misc and wlr also import wayland-protocols.
# Upgrade and test the client and protocol bindings as one set.
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
xcursor = "0.3.11"
xkbcommon = "0.9.0"
