name: Install Linux dependencies
description: Install the native build tools and test dependencies required by waywire

runs:
  using: composite
  steps:
    # Smithay uses the pure-Rust Wayland backend and Pixman CPU rendering.
    # Headless compositor tests need no display server or GPU.
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          pkg-config \
          libpixman-1-dev \
          libxkbcommon-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libpipewire-0.3-dev \
          libclang-dev \
          nasm \
          pipewire-bin \
          fonts-dejavu-core \
          shellcheck
