[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0-rc.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# pedantic
missing_errors_doc = "allow"

# restriction
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
get_unwrap = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
panic_in_result_fn = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
waywire-protocol = { path = "crates/protocol" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
calloop = { version = "0.14.5", features = ["signals"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
# Pin the tested syscall wrappers: both binaries rely on their FD, polling,
# signal and process-control behavior for backpressure and child cleanup.
nix = { version = "=0.31.3", features = ["fs", "mman", "poll", "process", "signal", "time"] }
pangocairo = "0.22.9"
rust-embed = { version = "8.13.0", features = ["deterministic-timestamps"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
smithay = { git = "https://github.com/Smithay/smithay", rev = "d33a9c98fbd4d0ddd85315f93d436747bf3393a6", default-features = false, features = ["desktop", "wayland_frontend", "renderer_pixman", "xwayland", "backend_libei"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
# Smithay provides no server state for wlr-screencopy; the compositor implements
# that protocol directly over these generated bindings.
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }
