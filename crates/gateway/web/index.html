<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Waywire</title>
    <link rel="stylesheet" href="/src/viewer/style.css" />
  </head>
  <body>
    <main id="stage" class="stage" data-pointer="moving" data-panel="floating">
      <canvas
        id="display"
        tabindex="0"
        aria-label="Interactive streamed Wayland desktop"
      ></canvas>
      <div id="signal" class="signal" data-state="idle" role="status">
        <p>
          <span id="signal-headline">Connecting</span>
          <span id="signal-message" class="signal-detail"></span>
        </p>
      </div>
      <p id="lease-notice" class="lease-notice" role="status" hidden></p>
      <!-- One measurement per row, each labelled with what it measures. The
           readout holds a fixed width so the numbers stay put as they change. -->
      <dl id="hud" class="hud" hidden>
        <dt>Resolution</dt>
        <dd data-field="resolution" data-resize="idle">-</dd>
        <dt>Frame rate</dt>
        <dd data-field="rate">-</dd>
        <dt>Bitrate</dt>
        <dd data-field="bitrate">-</dd>
        <dt>Encode scale</dt>
        <dd data-field="scale">-</dd>
        <dt>Round trip</dt>
        <dd data-field="rtt">-</dd>
        <dt>Frame lateness</dt>
        <dd data-field="late">-</dd>
        <dt>Latency target</dt>
        <dd data-field="target">-</dd>
        <dt>Clock error</dt>
        <dd data-field="clock">-</dd>
        <dt>Input queue</dt>
        <dd data-field="input-queue">-</dd>
        <dt>Decode queue</dt>
        <dd data-field="decode-queue">-</dd>
        <dt>Frames dropped</dt>
        <dd data-field="dropped">-</dd>
        <dt>Frames received</dt>
        <dd data-field="received">-</dd>
        <dt>Last resize</dt>
        <dd data-field="resize">-</dd>
        <dt>Codec</dt>
        <dd data-field="codec">-</dd>
      </dl>
      <!-- The key sits exactly where the panel's close button lands, so the
           menu opens over it and closing puts the key back under the pointer.
           Icons are Lucide, one set, drawn at 16px. -->
      <button
        id="menu-key"
        class="menu-key"
        type="button"
        popovertarget="panel"
        aria-label="Menu"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10 5H3" />
          <path d="M12 19H3" />
          <path d="M14 3v4" />
          <path d="M16 17v4" />
          <path d="M21 12h-9" />
          <path d="M21 19h-5" />
          <path d="M21 5h-7" />
          <path d="M8 10v4" />
          <path d="M8 12H3" />
        </svg>
      </button>
      <div id="panel" class="panel" popover>
        <ul class="menu" role="list" aria-label="Input">
          <li>
            <label
              class="item"
              for="control-toggle"
              title="Your mouse, keyboard, and scrolling reach the desktop while this is on. Turn it off to watch without touching anything."
            >
              <svg
                class="glyph"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"
                />
              </svg>
              <span class="label">Input</span>
              <span class="toggle">
                <span class="toggle-knob" aria-hidden="true"></span>
                <input
                  id="control-toggle"
                  name="input"
                  type="checkbox"
                  role="switch"
                  checked
                />
              </span>
            </label>
          </li>
          <li>
            <button
              id="pointer-lock"
              class="item"
              type="button"
              title="Hand the pointer to the desktop so it can move past the edge of the window and apps can read raw movement. Press Escape to end it."
            >
              <svg
                class="glyph"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <span class="label">Lock pointer</span>
            </button>
          </li>
          <li class="on-touch">
            <button
              id="keyboard"
              class="item"
              type="button"
              title="Open this device's keyboard and type into the desktop."
            >
              <svg
                class="glyph"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path d="M10 8h.01" />
                <path d="M12 12h.01" />
                <path d="M14 8h.01" />
                <path d="M16 12h.01" />
                <path d="M18 8h.01" />
                <path d="M6 8h.01" />
                <path d="M7 16h10" />
                <path d="M8 12h.01" />
                <rect width="20" height="16" x="2" y="4" rx="2" />
              </svg>
              <span class="label">On-screen keyboard</span>
            </button>
          </li>
        </ul>
        <ul class="menu" role="list" aria-label="Clipboard">
          <li>
            <button
              id="send-clipboard"
              class="item"
              type="button"
              title="Put what is on this computer's clipboard onto the desktop's clipboard, ready to paste over there."
            >
              <svg
                class="glyph"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path d="M11 14h10" />
                <path d="M16 4h2a2 2 0 0 1 2 2v1.344" />
                <path d="m17 18 4-4-4-4" />
                <path
                  d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113"
                />
                <rect x="8" y="2" width="8" height="4" rx="1" />
              </svg>
              <span class="label">Copy clipboard to the desktop</span>
            </button>
          </li>
          <li>
            <button
              id="copy-clipboard"
              class="item"
              type="button"
              title="The desktop's clipboard is empty."
              disabled
            >
              <svg
                class="glyph"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
                <path
                  d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"
                />
                <path d="M16 4h2a2 2 0 0 1 2 2v4" />
                <path d="M21 14H11" />
                <path d="m15 10-4 4 4 4" />
              </svg>
              <span class="label">Copy clipboard to this computer</span>
            </button>
          </li>
          <li id="clipboard-status" class="note" aria-live="polite"></li>
        </ul>
        <ul class="menu" role="list" aria-label="Picture">
          <li>
            <label
              class="item"
              for="hud-toggle"
              title="Show what the stream is doing in the corner of the screen."
            >
              <svg
                class="glyph"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"
                />
              </svg>
              <span class="label">Stats</span>
              <span class="toggle">
                <span class="toggle-knob" aria-hidden="true"></span>
                <input
                  id="hud-toggle"
                  name="stats"
                  type="checkbox"
                  role="switch"
                />
              </span>
            </label>
          </li>
          <li>
            <div
              id="latency"
              class="item latency"
              role="radiogroup"
              aria-labelledby="latency-label"
              title="How much of the stream to hold back before drawing it. A shorter target reacts sooner, a longer one rides out a bumpy connection."
            >
              <svg
                class="glyph"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path d="m12 14 4-4" />
                <path d="M3.34 19a10 10 0 1 1 17.32 0" />
              </svg>
              <span id="latency-label" class="label">Latency target</span>
              <span class="segmented">
                <label class="segment">
                  <input name="latency" type="radio" value="60" checked />
                  <span>60 ms</span>
                </label>
                <label class="segment">
                  <input name="latency" type="radio" value="100" />
                  <span>100 ms</span>
                </label>
                <label class="segment">
                  <input name="latency" type="radio" value="180" />
                  <span>180 ms</span>
                </label>
              </span>
            </div>
          </li>
          <li>
            <button
              id="reset-video"
              class="item"
              type="button"
              title="Throw away the decoder and start the picture again. Use it if the video tears, freezes, or goes wrong."
            >
              <svg
                class="glyph"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                <path d="M8 16H3v5" />
              </svg>
              <span class="label">Reset video</span>
            </button>
          </li>
        </ul>
        <div class="panel-foot">
          <p id="panel-status" class="status" role="status">
            <span id="status" class="dot" data-state="idle"></span>
            <span id="status-video">Connecting</span>
          </p>
          <div class="tools">
            <button
              id="fullscreen"
              class="tool"
              type="button"
              aria-label="Full screen"
              title="Fill the screen with the desktop."
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
              </svg>
            </button>
            <button
              id="pin-panel"
              class="tool"
              type="button"
              aria-label="Keep the menu open"
              title="Keep this menu open while you use the desktop."
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 17v5" />
                <path
                  d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                />
              </svg>
            </button>
            <button
              id="close-panel"
              class="tool"
              type="button"
              aria-label="Close"
              title="Close this menu."
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <input
        id="ime-proxy"
        class="ime-proxy"
        aria-label="Text input"
        autocomplete="off"
      />
    </main>
    <script type="module" src="/src/viewer/client.ts"></script>
  </body>
</html>
