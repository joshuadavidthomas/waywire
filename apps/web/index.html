<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprite Desktop Stream</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">WAYMOTE</span>
          <h1>Remote workspace</h1>
        </div>
        <div class="status-group">
          <div id="control-status" class="status disconnected">
            Click stream to control
          </div>
          <div id="status" class="status disconnected">Video connecting</div>
        </div>
      </header>
      <section class="display-shell" aria-label="Streamed Wayland desktop">
        <canvas
          id="display"
          tabindex="0"
          aria-label="Interactive streamed Wayland desktop"
        ></canvas>
        <div id="empty" class="empty">Waiting for the first keyframe…</div>
      </section>
      <footer>
        <span id="codec">H.264 · WebCodecs</span>
        <div class="clipboard-controls">
          <label class="latency-control">
            Latency
            <select id="latency" aria-label="Stream latency">
              <option value="60" selected>Low · 60 ms</option>
              <option value="100">Balanced · 100 ms</option>
              <option value="180">Smooth · 180 ms</option>
            </select>
          </label>
          <button id="pointer-lock" type="button">Lock pointer</button>
          <button id="text-input" type="button">Text input</button>
          <button id="send-clipboard" type="button">
            Send local clipboard
          </button>
          <button id="copy-clipboard" type="button" disabled>
            Copy remote clipboard
          </button>
          <span id="clipboard-status">Clipboard connecting</span>
        </div>
        <span id="metrics">No frames yet</span>
        <input
          id="ime-proxy"
          class="ime-proxy"
          aria-label="Text input"
          autocomplete="off"
        />
      </footer>
    </main>
    <script type="module" src="/src/client.ts"></script>
  </body>
</html>
