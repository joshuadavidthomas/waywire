name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA which is not on origin/main; refusing to release." >&2
            exit 1
          fi

      - uses: ./.github/actions/install-linux-dependencies

      - name: Cache rustup toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: ${{ runner.os }}-${{ runner.arch }}-rustup-pinned-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rustup-pinned-

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-
            ${{ runner.os }}-cargo-registry-

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true
          enable-cache: true

      - name: Install just
        run: uv tool install rust-just

      - name: Install Node from package.json
        run: |
          npm install --prefix "$RUNNER_TEMP/waywire-node" --no-package-lock --no-audit --no-fund \
            "node@$(node -p 'require("./package.json").engines.node')" corepack
          echo "$RUNNER_TEMP/waywire-node/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install pnpm workspace
        run: |
          corepack enable --install-directory "$RUNNER_TEMP/waywire-node/node_modules/.bin"
          pnpm install --frozen-lockfile

      - name: Test
        run: just test

      - name: Package
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          scripts/package-release "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          [[ "${GITHUB_REF_NAME#v}" == *-* ]] && options+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            dist/release/*.tar.gz \
            dist/release/SHA256SUMS \
            --title "waywire ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            "${options[@]}"
